<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World Bite · Kitchen Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#3a2618 0%,#140f0c 60%);color:#fff8f0;font-family:system-ui,-apple-system,Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 26px) 18px 30px;user-select:none}
.k{font-size:11px;letter-spacing:.24em;opacity:.65}
h1{font-size:28px;margin:6px 0 4px;font-weight:800}
p.s{opacity:.7;font-size:14px;margin-bottom:22px}
h2{font-size:13px;letter-spacing:.12em;opacity:.7;margin:20px 0 10px;text-transform:uppercase}
.chefs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chef{background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:18px;padding:10px 6px 12px;text-align:center;transition:.2s}
.chef.on{border-color:#ff7a45;background:rgba(255,122,69,.14)}
.chef svg{width:74px;height:88px}
.chef b{display:block;font-size:13px;margin-top:4px}.chef small{font-size:11px;opacity:.6}
.card{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.06);border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.08)}
.card .e{font-size:38px;width:56px;height:56px;display:grid;place-items:center;background:rgba(255,255,255,.07);border-radius:14px}
.card b{font-size:16px}.card small{display:block;opacity:.65;font-size:12px;margin-top:3px;line-height:1.4}
.card.new{border-color:rgba(255,122,69,.5)}
.tag{font-size:10px;background:#ff7a45;color:#fff;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
</style>
</head>
<body>
<div class="k">WORLD BITE · KITCHEN LAB</div>
<h1>Mutfağa hoş geldin</h1>
<p class="s">Şefini seç, tarifi seç; o anlatsın, sen izle ya da birlikte pişirin.</p>
<h2>Şefin</h2>
<div class="chefs" id="chefs"></div>
<h2>Tarifler</h2>
<div id="recipes"></div>
<script>
const CH=[['leyla','Leyla nənə','Sevimli büyükanne'],['zeynep','Zeynep teyze','Sıcak, misafirperver'],['aylin','Şef Aylin','Genç ve neşeli']];
const face={leyla:`<path d="M30 240 Q30 205 100 200 Q170 205 170 240 Z" fill="#7C4A3A"/><circle cx="100" cy="135" r="52" fill="#F5CFAE"/><path d="M50 130 Q48 78 100 76 Q152 78 150 130 Q140 100 100 100 Q60 100 50 130 Z" fill="#C9CCD3"/><circle cx="100" cy="72" r="20" fill="#C9CCD3"/><circle cx="80" cy="135" r="13" fill="none" stroke="#5B4636" stroke-width="3"/><circle cx="120" cy="135" r="13" fill="none" stroke="#5B4636" stroke-width="3"/><circle cx="80" cy="136" r="5" fill="#2B1D14"/><circle cx="120" cy="136" r="5" fill="#2B1D14"/>`,
aylin:`<path d="M30 240 Q30 205 100 200 Q170 205 170 240 Z" fill="#fff"/><path d="M78 204 L100 230 L122 204 Z" fill="#E0482F"/><circle cx="100" cy="135" r="50" fill="#EDC09A"/><path d="M52 128 Q54 92 100 90 Q146 92 148 128 Q128 108 100 112 Q72 108 52 128 Z" fill="#4A2C20"/><path d="M52 92 Q48 52 76 50 Q84 26 100 34 Q116 26 124 50 Q152 52 148 92 Z" fill="#fff"/><circle cx="82" cy="136" r="5" fill="#2B1D14"/><circle cx="118" cy="136" r="5" fill="#2B1D14"/>`,
zeynep:`<path d="M30 240 Q30 205 100 200 Q170 205 170 240 Z" fill="#2F6F62"/><path d="M44 140 Q40 70 100 64 Q160 70 156 140 Q160 196 120 206 L80 206 Q40 196 44 140 Z" fill="#B83A5E"/><ellipse cx="100" cy="140" rx="40" ry="46" fill="#EFC29C"/><path d="M76 136 Q82 129 88 136" fill="none" stroke="#2B1D14" stroke-width="3.5"/><path d="M112 136 Q118 129 124 136" fill="none" stroke="#2B1D14" stroke-width="3.5"/>`};
const mouth='<path d="M84 160 Q100 178 116 160" fill="none" stroke="#8A3B2E" stroke-width="4" stroke-linecap="round"/>';
let chef='zeynep'; try{chef=localStorage.getItem('lab_chef')||'zeynep'}catch(e){}
function drawChefs(){document.getElementById('chefs').innerHTML=CH.map(([id,n,t])=>`<div class="chef ${id===chef?'on':''}" data-id="${id}"><svg viewBox="0 0 200 240">${face[id]}${mouth}</svg><b>${n}</b><small>${t}</small></div>`).join('')}
drawChefs();
document.getElementById('chefs').onclick=e=>{const c=e.target.closest('.chef');if(!c)return;chef=c.dataset.id;try{localStorage.setItem('lab_chef',chef)}catch(e){}drawChefs()};
const R=[['chef.html?r=etsote&chef=carla','👩🏽‍🍳','Carla ile et sote (gerçekçi)','Gerçek mutfak · gerçekçi şef · 11 adım · kamera akışa göre değişir',true],['chef.html?r=etsote','🥩','Et sote','Şefle birlikte · 11 adım · ~1 saat · gerçek zamanlayıcı ve alarm',true],['cake.html','🎂','Çilekli vanilyalı kek','Sinematik prototip · 14 adım · film gibi izle ya da kendin yap']];
let PR=null;try{PR=JSON.parse(localStorage.getItem('lab_progress')||'null')}catch(e){}
const TM=(()=>{try{return JSON.parse(localStorage.getItem('lab_timers')||'[]').filter(t=>!t.dismissed)}catch(e){return[]}})();
const resumeHTML=(PR&&PR.step>0&&Date.now()-PR.at<6*3600e3)?`<div class="card new" data-u="chef.html?r=${PR.r}&chef=${PR.chef}&resume=1"><div class="e">▶️</div><div><b>Kaldığın yerden devam et</b><small>${({carla:'Carla',leyla:'Leyla nənə',zeynep:'Zeynep teyze',aylin:'Şef Aylin'})[PR.chef]||PR.chef} · Adım ${PR.step+1}${TM.length?' · ⏱ '+TM[0].label+(TM[0].fired?' hazır!':' sürüyor'):''}</small></div></div>`:'';
document.getElementById('recipes').innerHTML=resumeHTML+R.map(([u,e,n,d,nw])=>`<div class="card ${nw?'new':''}" data-u="${u}"><div class="e">${e}</div><div><b>${n}${nw?'<span class="tag">YENİ</span>':''}</b><small>${d}</small></div></div>`).join('');
const GH=location.search.includes('ghost')?'&ghost=1':'';if(GH)document.querySelector('h1').textContent='Mutfağa hoş geldin 👻';
document.getElementById('recipes').onclick=e=>{const c=e.target.closest('.card');if(c)location.href=(c.dataset.u.includes('chef=')?c.dataset.u:c.dataset.u+(c.dataset.u.includes('?')?'&':'?')+'chef='+chef)+(c.dataset.u.includes('?')||!c.dataset.u.includes('cake')?GH:'')};
window.LAB={back:()=>false};
</script>
</body>
</html>

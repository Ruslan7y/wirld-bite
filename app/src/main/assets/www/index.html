<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>World Bite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 1. Splash: globe spins, plane orbits the other way, letters appear one by one (3 s) -->
<div id="splash" class="screen show">
  <div class="splash-logo" id="splashLogo"></div>
  <div class="splash-word" id="splashWord"></div>
  <div class="splash-tag" id="splashTag"></div>
</div>

<!-- 2. Onboarding -->
<div id="onboarding" class="screen"></div>

<!-- 3. Auth -->
<div id="auth" class="screen"></div>

<!-- 4. App -->
<div id="main" class="screen">
  <div id="views">
    <section class="view" id="v-explore"></section>
    <section class="view" id="v-travel"></section>
    <section class="view" id="v-list"></section>
    <section class="view" id="v-settings"></section>
  </div>
  <nav id="tabbar"></nav>
</div>

<div id="overlays"></div>
<div id="sheet-wrap"><div id="sheet-bg"></div><div id="sheet"></div></div>
<div id="toast"></div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="photos/photos.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/recipes.js"></script>
<script src="js/sigrecipes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
